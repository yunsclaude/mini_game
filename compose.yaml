# 로컬에서 운영과 같은 방식(Docker)으로 실행해 보기 위한 설정입니다.
#
#   실행: docker compose up -d --build
#   종료: docker compose down
#   로그: docker compose logs -f app
#
# 실제 API 키나 비밀번호를 이 파일에 절대 적지 마세요.
# 비밀값이 필요해지면 로컬에서는 .env.local, 배포에서는 서버 환경변수로 주입합니다.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # 왼쪽이 내 PC 포트, 오른쪽이 컨테이너 포트입니다.
    # 오른쪽 3000 은 project.json 의 port 값과 같아야 합니다.
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # 로컬 개발용 DB 접속 주소입니다.
      # 아래 db 서비스를 가리킵니다. 진짜 비밀번호가 아니라 내 PC 안에서만 쓰는 값입니다.
      # 운영에서는 compose.prod.yaml 이 이 값을 서버가 만든 것으로 덮어씁니다.
      DATABASE_URL: "postgresql://app:localdev@db:5432/app"

    # API 키 같은 비밀값을 여기서 읽어 앱에 넣어 줍니다.
    #
    # 내 PC   : .env.local 파일을 직접 만들어 적습니다. (git 에 안 올라갑니다)
    # 배포서버: GitHub Secret 의 APP_ENV 값을 배포가 이 파일로 내려놓습니다.
    #
    # 파일이 없어도 정상 동작합니다. (required: false)
    env_file:
      - path: .env.local
        required: false

    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 배포 서버와 같은 방식으로 /api/health 를 호출해 정상 여부를 확인합니다.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 내 PC 에서만 쓰는 데이터베이스입니다.
  #
  # 운영 서버에서는 이 서비스를 쓰지 않습니다.
  # 거기서는 모든 프로젝트가 공용 PostgreSQL 하나를 나눠 쓰고,
  # compose.prod.yaml 이 이 서비스를 꺼 버립니다.
  #
  # 여기 적힌 비밀번호(localdev)는 내 PC 안에서만 통하는 값이라 그대로 둬도 됩니다.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: app
      TZ: Asia/Seoul
    # 내 PC 에서만 접속할 수 있게 엽니다.
    #
    # 앞의 127.0.0.1 이 중요합니다. 이게 없으면 같은 와이파이에 있는 다른 사람도
    # 내 데이터베이스에 접속할 수 있습니다. 지우지 마세요.
    #
    # 이 포트가 열려 있어야 npm run dev (Docker 밖에서 실행)로도 DB 를 쓸 수 있고,
    # DBeaver 같은 도구로 들여다볼 수도 있습니다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # 앱은 이 검사가 통과한 뒤에 시작합니다. (depends_on)
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# 내 PC 의 DB 데이터가 저장되는 곳입니다.
# docker compose down 으로는 지워지지 않습니다.
# 완전히 초기화하려면: docker compose down -v
volumes:
  dbdata:
